name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(find . -name '*.go' -type f -not -path './.git/*')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Docker build
        run: docker build -t invoke-openai-proxy:ci .
